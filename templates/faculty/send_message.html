{% extends "faculty/faculty_layout.html" %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="mb-0">
        <i class="bi bi-envelope-fill text-success"></i> Send Message to {{ student.full_name }}
    </h4>
    <a href="{{ url_for('faculty.view_student', student_id=student.id) }}" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left"></i> Back to Student
    </a>
</div>

<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card shadow-sm">
            <div class="card-header">
                <div class="d-flex align-items-center gap-2">
                    <div class="avatar-circle-sm">{{ student.full_name[0].upper() }}</div>
                    <div>
                        <div class="fw-semibold">{{ student.full_name }}</div>
                        <small class="text-muted">{{ student.student_id }} &bull; {{ student.user.email }}</small>
                    </div>
                </div>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Subject <span class="text-danger">*</span></label>
                        <input type="text" name="subject" class="form-control" placeholder="e.g. Regarding your recent assessment" required maxlength="200">
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Message <span class="text-danger">*</span></label>
                        <textarea name="body" class="form-control" rows="6" placeholder="Write your message here..." required maxlength="2000"></textarea>
                        <div class="form-text">Maximum 2000 characters.</div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold">Priority</label>
                        <select name="priority" class="form-select">
                            {% for p in priorities %}
                                <option value="{{ p }}" {{ 'selected' if p == 'normal' else '' }}>
                                    {{ p.capitalize() }}
                                </option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-send-fill"></i> Send Message
                        </button>
                        <a href="{{ url_for('faculty.view_student', student_id=student.id) }}" class="btn btn-outline-secondary">
                            Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<style>
.avatar-circle-sm {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: white; font-weight: 700; font-size: .95rem;
    flex-shrink: 0;
}
</style>
{% endblock %}
