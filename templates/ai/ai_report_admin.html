{% extends "admin/admin_layout.html" %}
{# AI Report page for admin viewing a student's report #}

{% block extra_css %}
<style>
/* ── AI Report Page Styles ───────────────────────────────────────────────── */
.ai-report-header {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white; border-radius: 1rem; padding: 2rem; margin-bottom: 1.5rem;
    position: relative; overflow: hidden;
}
.ai-report-header::before {
    content: ''; position: absolute; top: -50%; right: -10%;
    width: 300px; height: 300px; background: rgba(255,255,255,0.05); border-radius: 50%;
}
.health-gauge-wrap { text-align: center; }
.health-gauge-circle {
    width: 130px; height: 130px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    flex-direction: column; font-weight: bold; color: white; font-size: 1.8rem; margin-bottom: .5rem;
}
.gauge-low    { background: linear-gradient(135deg, #28a745, #20c997); }
.gauge-medium { background: linear-gradient(135deg, #ffc107, #fd7e14); }
.gauge-high   { background: linear-gradient(135deg, #dc3545, #c82333); }
.risk-badge { font-size: 1rem; padding: .4rem 1.2rem; border-radius: 2rem; }
.section-card {
    background: var(--card-bg); border-radius: .75rem; border: 1px solid var(--border);
    padding: 1.25rem 1.5rem; margin-bottom: 1rem; box-shadow: var(--shadow);
}
.section-card h6 {
    font-size: .8rem; letter-spacing: .05em; text-transform: uppercase;
    color: var(--text-muted); margin-bottom: .75rem; font-weight: 700;
}
.breakdown-row { display: flex; align-items: center; gap: .75rem; margin-bottom: .5rem; }
.breakdown-label { width: 180px; font-size: .85rem; flex-shrink: 0; }
.breakdown-bar { flex: 1; }
.breakdown-val { width: 55px; text-align: right; font-size: .85rem; font-weight: 600; }
@media print {
    .no-print { display: none !important; }
    .ai-report-header { background: #667eea !important; -webkit-print-color-adjust: exact; }
}
</style>
{% endblock %}

{% block content %}
{% include "ai/_report_body.html" %}
{% endblock %}

{% block extra_js %}
{% include "ai/_report_js.html" %}
{% endblock %}
