{% extends "base.html" %}

{% block body_content %}
<div class="error-page">
    <div class="error-content text-center">
        <i class="bi bi-shield-x error-icon"></i>
        <h1 class="error-code">403</h1>
        <h2 class="error-title">Access Denied</h2>
        <p class="error-message">You don't have permission to access this resource.</p>
        <a href="{{ url_for('main.index') }}" class="btn btn-primary btn-lg">
            <i class="bi bi-house"></i> Go Home
        </a>
    </div>
</div>

<style>
.error-page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
    color: white;
}
.error-icon {
    font-size: 6rem;
    opacity: 0.8;
}
.error-code {
    font-size: 8rem;
    font-weight: bold;
    margin: 2rem 0 1rem;
}
.error-title {
    font-size: 2rem;
    margin-bottom: 1rem;
}
.error-message {
    font-size: 1.2rem;
    margin-bottom: 2rem;
    opacity: 0.9;
}
</style>
{% endblock %}
